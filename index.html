<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Spelling Bee</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Trebuchet MS', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        :root {
            --blue: #4A9EFF;
            --blue-dark: #2E7FE0;
            --orange: #FF9E6D;
            --pink: #FF6DB4;
            --green: #2ECC71;
            --red: #FF5C5C;
            --purple: #9B7EFF;
            --ink: #2D3436;
            --ink-soft: #636E72;
            --surface: #FFFFFF;
            --bg-soft: #F7FAFF;
            --pad: 16px;
        }
        
        html, body { min-height: 100%; }
        
        body {
            background: linear-gradient(160deg, #4A9EFF 0%, #9B7EFF 50%, #FF9E6D 100%);
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 14px 12px 30px;
            color: var(--ink);
        }
        
        .container {
            width: 100%;
            max-width: 500px;
            background: var(--surface);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            overflow: hidden;
            margin: 0 auto;
        }
        
        /* ===== HEADER ===== */
        .app-header {
            background: linear-gradient(135deg, var(--blue) 0%, var(--purple) 100%);
            padding: 18px var(--pad);
            text-align: center;
            position: relative;
        }
        
        .app-header h1 {
            color: white;
            font-size: 1.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        
        .app-header .bee {
            display: inline-block;
            font-size: 1.3rem;
            margin: 0 4px;
            animation: wiggle 2s ease-in-out infinite;
            vertical-align: middle;
        }
        
        @keyframes wiggle {
            0%, 100% { transform: rotate(-8deg); }
            50% { transform: rotate(8deg); }
        }
        
        /* ===== USER BAR (always visible when logged in) ===== */
        .user-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #FFF5EB 0%, #FFE5F1 100%);
            border-bottom: 2px solid #FFD9C7;
            padding: 10px var(--pad);
        }
        
        .user-bar .u-avatar {
            font-size: 1.8rem;
            line-height: 1;
            flex-shrink: 0;
        }
        
        .user-bar .u-name {
            flex: 1;
            min-width: 0;
            font-weight: bold;
            color: var(--ink);
            font-size: 0.95rem;
            text-align: left;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .user-bar .u-edit {
            background: white;
            border: 2px solid #FFD9C7;
            color: var(--pink);
            font-family: inherit;
            font-weight: bold;
            font-size: 0.78rem;
            padding: 7px 12px;
            border-radius: 10px;
            cursor: pointer;
            flex-shrink: 0;
            white-space: nowrap;
        }
        
        .user-bar .u-edit:active {
            background: var(--pink);
            color: white;
            transform: scale(0.96);
        }
        
        /* ===== BODY ===== */
        .app-body {
            padding: 18px var(--pad) 22px;
        }
        
        .screen { display: none; }
        .active { display: block; animation: slideIn 0.3s ease; }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* ===== UNIVERSAL FORM STYLES ===== */
        .field-label {
            display: block;
            font-weight: bold;
            color: var(--ink);
            font-size: 0.9rem;
            margin: 14px 0 6px;
        }
        .field-label:first-of-type { margin-top: 0; }
        
        .text-input {
            display: block;
            width: 100%;
            padding: 13px 15px;
            border-radius: 13px;
            border: 2.5px solid #E4E9F2;
            font-size: 1rem;
            font-family: inherit;
            background: var(--bg-soft);
            color: var(--ink);
            transition: all 0.2s;
        }
        .text-input:focus {
            outline: none;
            border-color: var(--blue);
            background: white;
            box-shadow: 0 0 0 4px rgba(74, 158, 255, 0.15);
        }
        .text-input::placeholder { color: #B0B8C4; }
        
        /* ===== UNIVERSAL BUTTONS ===== */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            min-height: 46px;
            padding: 13px 20px;
            border: none;
            border-radius: 13px;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.98rem;
            line-height: 1.2;
            cursor: pointer;
            color: white;
            transition: transform 0.15s;
            text-align: center;
        }
        .btn:active:not(:disabled) { transform: scale(0.97); }
        .btn:disabled { opacity: 0.55; cursor: not-allowed; }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--blue), var(--blue-dark));
            box-shadow: 0 4px 12px rgba(74, 158, 255, 0.35);
        }
        .btn-accent {
            background: linear-gradient(135deg, var(--orange), var(--pink));
            box-shadow: 0 4px 12px rgba(255, 109, 180, 0.35);
        }
        .btn-lookup {
            background: linear-gradient(135deg, var(--purple), var(--blue));
            box-shadow: 0 4px 12px rgba(155, 126, 255, 0.35);
        }
        .btn-ghost {
            background: #F1F4F9;
            color: var(--ink);
            border: 2px solid #E4E9F2;
        }
        .btn-danger {
            background: #FFF0F0;
            color: var(--red);
            border: 2px solid #FFD0D0;
        }
        
        /* Universal button/input spacing */
        .stack > * + * { margin-top: 10px; }
        .stack-lg > * + * { margin-top: 14px; }
        
        /* ===== WELCOME SCREEN ===== */
        .big-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            margin: 0 auto 14px;
            box-shadow: 0 8px 20px rgba(74, 158, 255, 0.35);
        }
        
        .welcome-text {
            text-align: center;
            color: var(--ink-soft);
            margin-bottom: 14px;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        
        /* ===== AVATAR PICKER (shared) ===== */
        .avatar-picker {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin: 14px 0;
        }
        
        .avatar-opt {
            aspect-ratio: 1 / 1;
            width: 100%;
            border-radius: 14px;
            background: #F1F4F9;
            border: 3px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.7rem;
            cursor: pointer;
            transition: all 0.15s;
            user-select: none;
            padding: 0;
        }
        .avatar-opt.selected {
            border-color: var(--pink);
            background: #FFF0F6;
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(255, 109, 180, 0.3);
        }
        
        /* ===== ADD CARD ===== */
        .add-card {
            background: linear-gradient(135deg, #F7F9FF 0%, #EFF5FF 100%);
            border: 2px dashed #C8D9F0;
            border-radius: 18px;
            padding: var(--pad);
            margin-bottom: 22px;
        }
        
        .add-card-title {
            font-size: 1rem;
            font-weight: bold;
            color: var(--blue-dark);
            margin-bottom: 10px;
        }
        
        /* ===== LIST HEADER ===== */
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .list-header h2 { font-size: 1.05rem; }
        
        .count-badge {
            background: linear-gradient(135deg, var(--orange), var(--pink));
            color: white;
            font-size: 0.78rem;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 20px;
            white-space: nowrap;
        }
        
        /* ===== WORD LIST ===== */
        .word-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
            padding: 2px;
            scrollbar-width: thin;
        }
        .word-list::-webkit-scrollbar { width: 6px; }
        .word-list::-webkit-scrollbar-thumb { background: #D5DDE8; border-radius: 3px; }
        
        .word-card {
            display: flex;
            align-items: center;   /* CENTER align fixes delete button alignment */
            gap: 12px;
            background: white;
            border-radius: 14px;
            padding: 12px 12px 12px 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-left: 5px solid var(--blue);
        }
        .word-card:nth-child(5n+1) { border-left-color: var(--blue); }
        .word-card:nth-child(5n+2) { border-left-color: var(--pink); }
        .word-card:nth-child(5n+3) { border-left-color: var(--orange); }
        .word-card:nth-child(5n+4) { border-left-color: var(--green); }
        .word-card:nth-child(5n+5) { border-left-color: var(--purple); }
        
        .word-number {
            width: 26px; height: 26px; min-width: 26px;
            border-radius: 50%;
            background: #EEF3FB;
            color: var(--blue-dark);
            font-size: 0.8rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .word-body {
            flex: 1;
            min-width: 0;
            text-align: left;
        }
        
        .word-text {
            font-size: 1.05rem;
            font-weight: bold;
            color: var(--ink);
            word-break: break-word;
            line-height: 1.25;
            display: block;
        }
        
        .word-def {
            font-size: 0.82rem;
            color: var(--ink-soft);
            line-height: 1.4;
            word-break: break-word;
            margin-top: 3px;
        }
        
        .delete-btn {
            background: #FFF0F0;
            border: none;
            color: var(--red);
            width: 36px; height: 36px; min-width: 36px;
            border-radius: 10px;
            font-size: 1.05rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-weight: bold;
            transition: all 0.15s;
        }
        .delete-btn:active { background: var(--red); color: white; transform: scale(0.92); }
        
        .empty-state {
            text-align: center;
            padding: 26px 20px;
            color: #A0ACBE;
            font-size: 0.9rem;
            background: #F7FAFF;
            border-radius: 14px;
            border: 2px dashed #D8E2EF;
            line-height: 1.5;
        }
        .empty-state .emoji {
            font-size: 2.2rem;
            display: block;
            margin-bottom: 8px;
            opacity: 0.8;
        }
        
        /* ===== PRACTICE / TEST ===== */
        .practice-card, .test-card {
            background: linear-gradient(135deg, #F0F7FF 0%, #EFF0FF 100%);
            border-radius: 18px;
            padding: var(--pad);
            border: 2px solid #DDE6F5;
        }
        
        .spell-input {
            display: block;
            width: 100%;
            padding: 14px;
            font-size: 1.15rem;
            text-align: center;
            letter-spacing: 2px;
            font-weight: bold;
            border-radius: 13px;
            border: 3px solid var(--blue);
            background: white;
            font-family: inherit;
            color: var(--ink);
            margin-top: 6px;
        }
        .spell-input:focus {
            outline: none;
            border-color: var(--purple);
            box-shadow: 0 0 0 5px rgba(155, 126, 255, 0.15);
        }
        
        .feedback {
            margin-top: 12px;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            text-align: center;
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-word;
        }
        .feedback:empty { display: none; }
        .feedback.correct { background: #D4F8E0; color: #0F7B3E; border: 2px solid #A8E6BC; }
        .feedback.incorrect { background: #FFE0E0; color: #B71C1C; border: 2px solid #FFB8B8; }
        
        .progress-wrap { margin-top: 14px; }
        .progress-bar {
            height: 10px;
            background: #E4E9F2;
            border-radius: 5px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--blue), var(--purple));
            width: 0%;
            transition: width 0.4s ease;
        }
        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--ink-soft);
            margin-top: 6px;
            font-weight: bold;
        }
        
        .results {
            margin-top: 14px;
            padding: var(--pad);
            background: linear-gradient(135deg, #FFF5EB, #FFE5F1);
            border-radius: 16px;
            border: 2px solid #FFD9C7;
            text-align: center;
        }
        .results h2 { color: var(--pink); margin-bottom: 8px; font-size: 1.15rem; }
        .results p { margin: 6px 0; }
        
        .celebrate {
            animation: celebrate 0.8s ease infinite alternate;
            color: var(--orange);
            font-size: 1.05rem;
            margin-top: 8px;
            font-weight: bold;
        }
        @keyframes celebrate {
            from { transform: scale(1); }
            to { transform: scale(1.06); }
        }
        
        .hint-img {
            max-width: 100%;
            max-height: 140px;
            object-fit: contain;
            margin: 12px auto 0;
            border-radius: 12px;
            display: none;
            border: 3px solid var(--blue);
        }
        
        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            background: var(--ink);
            color: white;
            padding: 12px 22px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.9rem;
            z-index: 1500;
            transition: transform 0.35s ease;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            max-width: calc(100vw - 40px);
            text-align: center;
            pointer-events: none;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { background: var(--green); }
        .toast.error { background: var(--red); }
        .toast.warning { background: #F39C12; }
        
        /* ===== MODAL (definition only) ===== */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 2500;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal.show { display: flex; }
        
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 22px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            position: relative;
            max-height: 85vh;
            overflow-y: auto;
        }
        
        .modal-close {
            position: absolute;
            top: 10px; right: 14px;
            font-size: 1.7rem;
            color: #AAA;
            cursor: pointer;
            line-height: 1;
            font-weight: bold;
            padding: 4px;
        }
        
        .modal-content h3 { color: var(--purple); margin-bottom: 12px; }
        
        .modal-def {
            background: #F7F9FF;
            padding: 14px;
            border-radius: 12px;
            text-align: left;
            line-height: 1.5;
            color: var(--ink);
            word-break: break-word;
        }
        
        .modal-def .word {
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--blue-dark);
            margin-bottom: 6px;
        }
        
        .spinner {
            display: inline-block;
            width: 15px; height: 15px;
            border: 2.5px solid rgba(255,255,255,0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 4px;
            vertical-align: -2px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        @media (max-width: 380px) {
            :root { --pad: 14px; }
            .app-header h1 { font-size: 1.3rem; }
            .avatar-opt { font-size: 1.5rem; }
            .big-avatar { width: 76px; height: 76px; font-size: 2.3rem; }
            .btn { font-size: 0.92rem; }
            .word-list { max-height: 260px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="app-header">
            <h1><span class="bee">🐝</span> Spelling Bee <span class="bee">🐝</span></h1>
        </div>
        
        <!-- User bar (hidden on welcome/profile screens) -->
        <div class="user-bar" id="user-bar" style="display: none;">
            <span class="u-avatar" id="ubar-avatar">👧</span>
            <span class="u-name" id="ubar-name">Name</span>
            <button class="u-edit" onclick="goToProfile()">👤 Change Avatar</button>
        </div>
        
        <div class="app-body">
            <!-- ===== WELCOME SCREEN ===== -->
            <div class="screen welcome-screen">
                <div class="big-avatar" id="preview-avatar">👧</div>
                <p class="welcome-text">Welcome! Pick your buddy and tell me your name.</p>
                
                <div class="avatar-picker" id="welcome-avatar-picker">
                    <button type="button" class="avatar-opt selected" onclick="pickAvatar('👧', this)">👧</button>
                    <button type="button" class="avatar-opt" onclick="pickAvatar('👦', this)">👦</button>
                    <button type="button" class="avatar-opt" onclick="pickAvatar('🐶', this)">🐶</button>
                    <button type="button" class="avatar-opt" onclick="pickAvatar('🐱', this)">🐱</button>
                    <button type="button" class="avatar-opt" onclick="pickAvatar('🦄', this)">🦄</button>
                </div>
                
                <label class="field-label" for="input-name">Your name:</label>
                <input type="text" class="text-input" id="input-name" placeholder="Type your name" autocomplete="off">
                
                <div class="stack" style="margin-top: 14px;">
                    <button class="btn btn-primary" onclick="startApp()">Let's Start! 🚀</button>
                </div>
            </div>
            
            <!-- ===== PROFILE SCREEN (dedicated, always accessible) ===== -->
            <div class="screen profile-screen">
                <h2 style="text-align: center; font-size: 1.15rem; margin-bottom: 6px;">👤 My Profile</h2>
                <p style="text-align: center; color: var(--ink-soft); font-size: 0.88rem; margin-bottom: 14px;">Change your avatar or name here.</p>
                
                <div class="big-avatar" id="profile-preview">👧</div>
                
                <div class="avatar-picker" id="profile-avatar-picker">
                    <button type="button" class="avatar-opt" onclick="pickProfileAvatar('👧', this)">👧</button>
                    <button type="button" class="avatar-opt" onclick="pickProfileAvatar('👦', this)">👦</button>
                    <button type="button" class="avatar-opt" onclick="pickProfileAvatar('🐶', this)">🐶</button>
                    <button type="button" class="avatar-opt" onclick="pickProfileAvatar('🐱', this)">🐱</button>
                    <button type="button" class="avatar-opt" onclick="pickProfileAvatar('🦄', this)">🦄</button>
                </div>
                
                <label class="field-label" for="profile-name-input">Your name:</label>
                <input type="text" class="text-input" id="profile-name-input" placeholder="Your name" autocomplete="off">
                
                <div class="stack" style="margin-top: 14px;">
                    <button class="btn btn-primary" onclick="saveProfile()">💾 Save Changes</button>
                    <button class="btn btn-ghost" onclick="cancelProfile()">Cancel</button>
                    <button class="btn btn-danger" onclick="resetApp()" style="margin-top: 8px;">🔄 Reset for New User</button>
                </div>
            </div>
            
            <!-- ===== WORD INPUT SCREEN ===== -->
            <div class="screen word-screen">
                <div class="add-card">
                    <div class="add-card-title">➕ Add a New Word</div>
                    
                    <label class="field-label" for="new-word">The word:</label>
                    <input type="text" class="text-input" id="new-word" placeholder="e.g. beautiful" autocomplete="off" autocapitalize="off">
                    
                    <label class="field-label" for="new-def">What it means (optional):</label>
                    <input type="text" class="text-input" id="new-def" placeholder="Tap Lookup or type your own" autocomplete="off">
                    
                    <div class="stack" style="margin-top: 12px;">
                        <button class="btn btn-lookup" id="lookup-btn" onclick="lookupDef()">🔍 Look Up the Definition</button>
                        <button class="btn btn-accent" onclick="addWord()">Add to My List</button>
                    </div>
                </div>
                
                <div class="list-header">
                    <h2>📚 My Word List</h2>
                    <span class="count-badge" id="count-badge">0 words</span>
                </div>
                
                <div class="word-list" id="word-list">
                    <div class="empty-state">
                        <span class="emoji">📝</span>
                        Your list is empty.<br>Add your first word above!
                    </div>
                </div>
                
                <div class="stack" style="margin-top: 18px;">
                    <button class="btn btn-primary" onclick="startPractice()">📖 Practice These Words</button>
                    <button class="btn btn-accent" id="start-test-btn" onclick="startTest()" style="display: none;">📝 Take a Test</button>
                </div>
            </div>
            
            <!-- ===== PRACTICE SCREEN ===== -->
            <div class="screen practice-screen">
                <div class="practice-card">
                    <div class="stack">
                        <button class="btn btn-primary" onclick="speakWord()">🔊 Hear the Word</button>
                        <button class="btn btn-ghost" onclick="showHint()">🖼️ Picture Hint</button>
                    </div>
                    
                    <img id="hint-img" class="hint-img" alt="Picture hint">
                    
                    <label class="field-label" for="practice-input">Type what you hear:</label>
                    <input type="text" class="spell-input" id="practice-input"
                           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                    
                    <div class="stack" style="margin-top: 12px;">
                        <button class="btn btn-accent" onclick="checkPractice()">Check My Spelling</button>
                        <button class="btn btn-ghost" onclick="showDefinition()">📖 Show Definition</button>
                        <button class="btn btn-ghost" onclick="nextPractice()">➡️ Next Word</button>
                    </div>
                    
                    <div class="feedback" id="practice-feedback"></div>
                </div>
                
                <div class="progress-wrap">
                    <div class="progress-bar"><div class="progress-fill" id="practice-progress"></div></div>
                    <div class="progress-text">
                        <span>Word <span id="practice-current">1</span> of <span id="practice-total">0</span></span>
                        <span id="practice-percent">0%</span>
                    </div>
                </div>
                
                <div class="stack" style="margin-top: 14px;">
                    <button class="btn btn-ghost" onclick="backToWords()">← Back to My List</button>
                </div>
            </div>
            
            <!-- ===== TEST SCREEN ===== -->
            <div class="screen test-screen">
                <div class="test-card">
                    <button class="btn btn-primary" onclick="speakWord()">🔊 Hear the Word</button>
                    
                    <label class="field-label" for="test-input">Spell the word:</label>
                    <input type="text" class="spell-input" id="test-input"
                           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                    
                    <div class="stack" style="margin-top: 12px;">
                        <button class="btn btn-accent" id="check-test-btn" onclick="checkTest()">Check Answer</button>
                        <button class="btn btn-ghost" onclick="nextTest()">➡️ Next Word</button>
                    </div>
                    
                    <div class="feedback" id="test-feedback"></div>
                </div>
                
                <div class="progress-wrap">
                    <div class="progress-bar"><div class="progress-fill" id="test-progress"></div></div>
                    <div class="progress-text">
                        <span>Word <span id="test-current">1</span> of <span id="test-total">0</span></span>
                        <span id="test-percent">0%</span>
                    </div>
                </div>
                
                <div class="results" id="test-results" style="display: none;"></div>
                
                <div class="stack" style="margin-top: 14px;">
                    <button class="btn btn-ghost" onclick="backToWords()">← Back to My List</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Definition Modal (only for viewing word definitions) -->
    <div id="def-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <h3>Word Definition</h3>
            <div class="modal-def" id="def-modal-content"></div>
            <div class="stack" style="margin-top: 12px;">
                <button class="btn btn-primary" onclick="closeModal()">Got it!</button>
            </div>
        </div>
    </div>
    
    <script>
        // ===== STORAGE (with in-memory fallback if localStorage is blocked) =====
        const memoryStore = {};
        let storageWorks = true;
        try {
            localStorage.setItem('__sb_test', '1');
            localStorage.removeItem('__sb_test');
        } catch (e) {
            storageWorks = false;
            console.warn('localStorage blocked — using in-memory store (data will not persist after refresh)');
        }
        
        const store = {
            get(key, def) {
                try {
                    if (storageWorks) {
                        const v = localStorage.getItem(key);
                        return v === null ? def : JSON.parse(v);
                    }
                    return memoryStore.hasOwnProperty(key) ? memoryStore[key] : def;
                } catch (e) { return def; }
            },
            set(key, val) {
                try {
                    if (storageWorks) localStorage.setItem(key, JSON.stringify(val));
                    else memoryStore[key] = val;
                } catch (e) { memoryStore[key] = val; }
            },
            remove(key) {
                try {
                    if (storageWorks) localStorage.removeItem(key);
                    memoryStore[key] = undefined;
                } catch (e) { memoryStore[key] = undefined; }
            }
        };
        
        // ===== STATE =====
        let userName = '';
        let userAvatar = '👧';
        let wordList = [];
        let currentIdx = 0;
        let correctCount = 0;
        let testAnswered = false;
        let tempProfileAvatar = '👧';
        let previousScreen = 'word-screen';
        
        // ===== BOOT =====
        window.addEventListener('load', () => {
            const savedName = store.get('sb_name', '');
            if (savedName) {
                userName = savedName;
                userAvatar = store.get('sb_avatar', '👧');
                wordList = store.get('sb_words', []);
                if (!Array.isArray(wordList)) wordList = [];
                updateUserBar();
                renderWords();
                showScreen('word-screen');
            } else {
                showScreen('welcome-screen');
            }
        });
        
        function showScreen(name) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            const t = document.querySelector('.' + name);
            if (t) t.classList.add('active');
            
            // Show/hide user bar
            const ub = document.getElementById('user-bar');
            if (name === 'welcome-screen' || name === 'profile-screen') {
                ub.style.display = 'none';
            } else {
                ub.style.display = 'flex';
                updateUserBar();
            }
            
            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        function updateUserBar() {
            document.getElementById('ubar-avatar').textContent = userAvatar;
            document.getElementById('ubar-name').textContent = userName;
        }
        
        // ===== WELCOME SCREEN =====
        function pickAvatar(emoji, el) {
            userAvatar = emoji;
            document.getElementById('preview-avatar').textContent = emoji;
            document.querySelectorAll('#welcome-avatar-picker .avatar-opt').forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');
        }
        
        function startApp() {
            const name = document.getElementById('input-name').value.trim();
            if (!name) {
                showToast('Please type your name!', 'warning');
                return;
            }
            userName = name;
            store.set('sb_name', userName);
            store.set('sb_avatar', userAvatar);
            updateUserBar();
            renderWords();
            showScreen('word-screen');
        }
        
        // ===== PROFILE SCREEN =====
        function goToProfile() {
            // Remember where we came from so Cancel returns there
            const active = document.querySelector('.screen.active');
            if (active) previousScreen = active.classList[1];
            
            tempProfileAvatar = userAvatar;
            document.getElementById('profile-preview').textContent = userAvatar;
            document.getElementById('profile-name-input').value = userName;
            
            // Highlight current avatar
            document.querySelectorAll('#profile-avatar-picker .avatar-opt').forEach(o => {
                o.classList.toggle('selected', o.textContent === userAvatar);
            });
            
            showScreen('profile-screen');
        }
        
        function pickProfileAvatar(emoji, el) {
            tempProfileAvatar = emoji;
            document.getElementById('profile-preview').textContent = emoji;
            document.querySelectorAll('#profile-avatar-picker .avatar-opt').forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');
        }
        
        function saveProfile() {
            const newName = document.getElementById('profile-name-input').value.trim();
            if (!newName) {
                showToast('Name cannot be empty!', 'warning');
                return;
            }
            userName = newName;
            userAvatar = tempProfileAvatar;
            store.set('sb_name', userName);
            store.set('sb_avatar', userAvatar);
            updateUserBar();
            showToast('Profile saved!', 'success');
            showScreen(previousScreen);
        }
        
        function cancelProfile() {
            showScreen(previousScreen);
        }
        
        function resetApp() {
            if (!confirm('This will clear everything for a new user. Continue?')) return;
            store.remove('sb_name');
            store.remove('sb_avatar');
            store.remove('sb_words');
            userName = '';
            userAvatar = '👧';
            wordList = [];
            document.getElementById('input-name').value = '';
            document.getElementById('preview-avatar').textContent = '👧';
            document.querySelectorAll('#welcome-avatar-picker .avatar-opt').forEach(o => o.classList.remove('selected'));
            document.querySelector('#welcome-avatar-picker .avatar-opt').classList.add('selected');
            showScreen('welcome-screen');
            showToast('Ready for a new user!', 'success');
        }
        
        // ===== LOOKUP =====
        async function lookupDef() {
            const word = document.getElementById('new-word').value.trim();
            if (!word) {
                showToast('Type a word first!', 'warning');
                document.getElementById('new-word').focus();
                return;
            }
            const btn = document.getElementById('lookup-btn');
            const orig = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Searching...';
            
            try {
                const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word.toLowerCase())}`);
                if (!res.ok) throw new Error('Not found');
                const data = await res.json();
                const best = findBestDefinition(data[0]);
                if (!best) throw new Error('No definition');
                document.getElementById('new-def').value = best.definition;
                showToast(`Found! (${best.partOfSpeech || 'word'})`, 'success');
            } catch (err) {
                showToast("Couldn't find it — type your own definition", 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = orig;
            }
        }
        
        function findBestDefinition(entry) {
            if (!entry || !entry.meanings) return null;
            const priority = { noun: 1, verb: 2, adjective: 3, adverb: 4 };
            const candidates = [];
            entry.meanings.forEach(m => {
                (m.definitions || []).forEach(d => {
                    if (d.definition && d.definition.length > 12 && d.definition.length < 200) {
                        candidates.push({
                            partOfSpeech: m.partOfSpeech || '',
                            definition: cleanDef(d.definition)
                        });
                    }
                });
            });
            if (candidates.length === 0) {
                const fm = entry.meanings[0];
                const fd = fm?.definitions?.[0];
                if (fd?.definition) {
                    return { partOfSpeech: fm.partOfSpeech || '', definition: cleanDef(fd.definition) };
                }
                return null;
            }
            candidates.sort((a, b) => {
                const pa = priority[a.partOfSpeech] || 5;
                const pb = priority[b.partOfSpeech] || 5;
                if (pa !== pb) return pa - pb;
                return a.definition.length - b.definition.length;
            });
            return candidates[0];
        }
        
        function cleanDef(text) {
            let t = text.trim().replace(/^\([^)]+\)\s*/, '');
            return t.charAt(0).toUpperCase() + t.slice(1);
        }
        
        // ===== ADD/REMOVE WORDS =====
        function addWord() {
            const word = document.getElementById('new-word').value.trim();
            const def = document.getElementById('new-def').value.trim();
            if (!word) {
                showToast('Please type a word!', 'warning');
                document.getElementById('new-word').focus();
                return;
            }
            if (wordList.some(w => w.word.toLowerCase() === word.toLowerCase())) {
                showToast('That word is already in your list!', 'warning');
                return;
            }
            wordList.push({ word, definition: def || 'No definition yet' });
            store.set('sb_words', wordList);
            renderWords();
            document.getElementById('new-word').value = '';
            document.getElementById('new-def').value = '';
            document.getElementById('new-word').focus();
            showToast(`"${word}" added!`, 'success');
        }
        
        function removeWord(i) {
            const removed = wordList[i].word;
            wordList.splice(i, 1);
            store.set('sb_words', wordList);
            renderWords();
            showToast(`"${removed}" removed`, 'success');
        }
        
        function renderWords() {
            const list = document.getElementById('word-list');
            const badge = document.getElementById('count-badge');
            const testBtn = document.getElementById('start-test-btn');
            badge.textContent = `${wordList.length} word${wordList.length !== 1 ? 's' : ''}`;
            testBtn.style.display = wordList.length > 0 ? 'flex' : 'none';
            
            if (wordList.length === 0) {
                list.innerHTML = `<div class="empty-state"><span class="emoji">📝</span>Your list is empty.<br>Add your first word above!</div>`;
                return;
            }
            
            list.innerHTML = wordList.map((w, i) => `
                <div class="word-card">
                    <div class="word-number">${i + 1}</div>
                    <div class="word-body">
                        <span class="word-text">${esc(w.word)}</span>
                        <div class="word-def">${esc(w.definition || 'No definition yet')}</div>
                    </div>
                    <button class="delete-btn" onclick="removeWord(${i})" aria-label="Remove">✕</button>
                </div>
            `).join('');
        }
        
        function esc(t) {
            if (t == null) return '';
            const d = document.createElement('div');
            d.textContent = String(t);
            return d.innerHTML;
        }
        
        // ===== PRACTICE =====
        function startPractice() {
            if (wordList.length === 0) { showToast('Add some words first!', 'warning'); return; }
            currentIdx = 0;
            document.getElementById('practice-total').textContent = wordList.length;
            showScreen('practice-screen');
            updatePracticeUI();
        }
        
        function updatePracticeUI() {
            const pct = Math.round((currentIdx / wordList.length) * 100);
            document.getElementById('practice-current').textContent = currentIdx + 1;
            document.getElementById('practice-progress').style.width = pct + '%';
            document.getElementById('practice-percent').textContent = pct + '%';
            document.getElementById('practice-input').value = '';
            document.getElementById('practice-feedback').textContent = '';
            document.getElementById('practice-feedback').className = 'feedback';
            document.getElementById('hint-img').style.display = 'none';
        }
        
        function speakWord() {
            if (wordList.length === 0) return;
            try {
                const u = new SpeechSynthesisUtterance(wordList[currentIdx].word);
                u.rate = 0.85;
                speechSynthesis.cancel();
                speechSynthesis.speak(u);
            } catch (e) { showToast('Audio not available', 'error'); }
        }
        
        function showHint() {
            if (wordList.length === 0) return;
            const word = wordList[currentIdx].word;
            const img = document.getElementById('hint-img');
            img.src = `https://loremflickr.com/300/200/${encodeURIComponent(word)}`;
            img.style.display = 'block';
            img.onerror = () => { img.style.display = 'none'; showToast('No picture for this word', 'warning'); };
        }
        
        function showDefinition() {
            if (wordList.length === 0) return;
            const w = wordList[currentIdx];
            document.getElementById('def-modal-content').innerHTML = `
                <div class="word">${esc(w.word)}</div>
                <div>${esc(w.definition)}</div>
            `;
            document.getElementById('def-modal').classList.add('show');
        }
        
        function closeModal() {
            document.getElementById('def-modal').classList.remove('show');
        }
        
        function checkPractice() {
            const input = document.getElementById('practice-input').value.trim().toLowerCase();
            const correct = wordList[currentIdx].word.toLowerCase();
            const fb = document.getElementById('practice-feedback');
            if (!input) { showToast('Type a word first!', 'warning'); return; }
            if (input === correct) {
                fb.textContent = '✅ Correct! Well done!';
                fb.className = 'feedback correct';
                confetti();
            } else {
                fb.innerHTML = `❌ Not quite. The word is: <strong>${esc(wordList[currentIdx].word)}</strong>`;
                fb.className = 'feedback incorrect';
            }
        }
        
        function nextPractice() {
            currentIdx = (currentIdx + 1) % wordList.length;
            updatePracticeUI();
        }
        
        // ===== TEST =====
        function startTest() {
            if (wordList.length === 0) { showToast('Add some words first!', 'warning'); return; }
            currentIdx = 0;
            correctCount = 0;
            document.getElementById('test-total').textContent = wordList.length;
            document.getElementById('test-results').style.display = 'none';
            showScreen('test-screen');
            updateTestUI();
        }
        
        function updateTestUI() {
            const pct = Math.round((currentIdx / wordList.length) * 100);
            document.getElementById('test-current').textContent = Math.min(currentIdx + 1, wordList.length);
            document.getElementById('test-progress').style.width = pct + '%';
            document.getElementById('test-percent').textContent = pct + '%';
            document.getElementById('test-input').value = '';
            document.getElementById('test-input').disabled = false;
            document.getElementById('test-feedback').textContent = '';
            document.getElementById('test-feedback').className = 'feedback';
            document.getElementById('check-test-btn').disabled = false;
            testAnswered = false;
        }
        
        function checkTest() {
            if (testAnswered) return;
            const input = document.getElementById('test-input').value.trim().toLowerCase();
            const correct = wordList[currentIdx].word.toLowerCase();
            const fb = document.getElementById('test-feedback');
            if (!input) { showToast('Type a word first!', 'warning'); return; }
            testAnswered = true;
            if (input === correct) {
                fb.textContent = '✅ Correct!';
                fb.className = 'feedback correct';
                correctCount++;
                confetti();
            } else {
                fb.innerHTML = `❌ The word is spelled: <strong>${esc(wordList[currentIdx].word)}</strong>`;
                fb.className = 'feedback incorrect';
            }
            document.getElementById('test-input').disabled = true;
            document.getElementById('check-test-btn').disabled = true;
        }
        
        function nextTest() {
            currentIdx++;
            if (currentIdx >= wordList.length) {
                const pct = Math.round((correctCount / wordList.length) * 100);
                const results = document.getElementById('test-results');
                results.style.display = 'block';
                results.innerHTML = `
                    <h2>🎉 Test Complete!</h2>
                    <p>You got <strong>${correctCount}</strong> of <strong>${wordList.length}</strong> correct</p>
                    <p style="font-size:1.4rem; color:var(--pink); font-weight:bold; margin-top:8px;">${pct}%</p>
                    ${correctCount === wordList.length ? '<p class="celebrate">⭐ Perfect Score! ⭐</p>' : ''}
                `;
                if (correctCount === wordList.length) confetti(30);
                return;
            }
            updateTestUI();
        }
        
        function backToWords() { showScreen('word-screen'); }
        
        // ===== UTILS =====
        function showToast(msg, type) {
            type = type || 'info';
            const t = document.createElement('div');
            t.className = 'toast ' + type;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.classList.add('show'), 10);
            setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 400); }, 2400);
        }
        
        function confetti(count) {
            count = count || 16;
            for (let i = 0; i < count; i++) {
                const c = document.createElement('div');
                c.style.cssText = `
                    position: fixed; left: ${Math.random() * 100}vw; top: -12px;
                    width: ${6 + Math.random() * 8}px; height: ${6 + Math.random() * 8}px;
                    background: hsl(${Math.random() * 360}, 100%, 62%); z-index: 3000;
                    pointer-events: none; border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
                    animation: confettiDrop ${2.5 + Math.random() * 2}s linear forwards;
                `;
                document.body.appendChild(c);
                setTimeout(() => c.remove(), 5000);
            }
        }
        
        (() => {
            const s = document.createElement('style');
            s.textContent = `@keyframes confettiDrop {
                0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
                100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
            }`;
            document.head.appendChild(s);
        })();
        
        document.addEventListener('keydown', e => {
            if (e.key !== 'Enter') return;
            const id = document.activeElement.id;
            if (id === 'input-name') startApp();
            else if (id === 'new-def') addWord();
            else if (id === 'practice-input') checkPractice();
            else if (id === 'test-input') checkTest();
            else if (id === 'profile-name-input') saveProfile();
        });
        
        document.getElementById('def-modal').addEventListener('click', e => {
            if (e.target.id === 'def-modal') closeModal();
        });
    </script>
